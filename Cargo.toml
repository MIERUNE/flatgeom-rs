[package]
name = "flatgeom"
version = "0.1.0"
edition = "2024"
description = "Geospatial geometry primitives represented as flat arrays with offsets"
repository = "https://github.com/MIERUNE/flatgeom-rs"
authors = ["Taku Fukada <naninunenor@gmail.com>", "MIERUNE Inc. <info@mierune.co.jp>"]
license = "MIT"
categories = ["graphics", "science", "no-std"]

[features]
default = ["geozero"]

[dependencies]
num-traits = "0.2.19"
geo-traits = { version = "0.3", default-features = false, optional = true }
geozero = { version = "0.15", default-features = false, optional = true }
serde = { version = "1.0.203", features = ["derive"], optional = true }
geo-types = { version = "0.7.19", default-features = false, optional = true }

[dev-dependencies]
geo-types = { version = "0.7", features = ["serde"] }
geojson = "1"
indexmap = "2.14"
thiserror = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
geozero = { version = "0.15", features = ["with-wkt"] }
lz4_flex = "0.13"
postcard = { version = "1", features = ["alloc"] }

[[example]]
name = "postcard_bench"
required-features = ["serde"]
